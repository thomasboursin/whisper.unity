```yaml
name: Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  testAllModes:
    name: Test in Unity ${{ matrix.unityVersion }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2021.3.58f1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Unity PlayMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: playmode
          unityVersion: ${{ matrix.unityVersion }}
          checkName: Unity ${{ matrix.unityVersion }} Test Results
          artifactsPath: artifacts
          coverageOptions: 'generateHtmlReport;assemblyFilters:+com.whisper.unity'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-Unity-${{ matrix.unityVersion }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.coveragePath != ''
        with:
          name: Coverage-Unity-${{ matrix.unityVersion }}
          path: ${{ steps.tests.outputs.coveragePath }}
          if-no-files-found: warn
          retention-days: 14
```
